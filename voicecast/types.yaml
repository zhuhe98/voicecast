# ── 声音卡 v2（Agent 填写，voicecast/cards.py 校验与渲染）──────────────
pitch_scale: [very low, low, medium-low, medium, medium-high, high, very high]
vocab:
  quality: [smooth, clear, crisp, bright, mellow, warm, soft, sweet, thin, light, full, rich, deep, resonant, round,
            husky, slightly husky, raspy, gravelly, hoarse, breathy, airy, nasal, sharp, piercing, magnetic, velvety,
            aged, weathered, frail, shaky, youthful, childlike]
  resonance: [head-voice, chest]
  pace: [very slow, slow, medium, fast, very fast]
  energy: [low, moderate, high, very high]
  intonation: [flat, steady, lively, wide-ranging, sing-song]
attitude_max_words: 6
attitude_banned: [like, as if, sounds like, character, role, imitate, impersonate]

# 固有属性（声音卡 v1：每维 2 档；单个维度对"是谁"的控制弱，主要提供方向与可解释性）
attributes:
  roughness:   {lo: smooth, hi: slightly husky}
  breathiness: {lo: firm, hi: breathy airy}
  resonance:   {lo: bright head-voice resonance, hi: warm chest resonance}
  weight:      {lo: thin and light, hi: full and rich}
  nasality:    {lo: "", hi: ", with a slight nasal tint"}

# 情绪描述（P0.5：M3 = 锁定声音的说话人向量 + 情绪描述，每句三选一）
emotions:
  neutral: ""
  happy: very happy and excited tone, bright smiling voice, lively fast pace
  angry: furious angry tone, loud forceful voice, sharp emphatic delivery
  sad: deeply sad tone, soft trembling voice on the verge of tears, slow pace
  surprised: shocked surprised tone, sudden rising pitch, gasping delivery
